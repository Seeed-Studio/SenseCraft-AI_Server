<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SenseCraft AI</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="industrial-container">
    <!-- 顶部导航栏 -->
    <nav class="navbar">
      <div class="navbar-brand">
        <h1>SenseCraft AI</h1>
      </div>
      <ul class="navbar-nav">
        <li><span class="nav-link" id="currentTime"> 加载中...</span></li>
      </ul>
    </nav>

    <!-- 主内容区域 -->
    <div class="main-content">
      <!-- 视频监控区域 -->
      <div class="video-section">
        <div class="video-grid" id="videoGrid">
          <div class="video-card placeholder-card">
            <div class="video-card-placeholder">
              <p>🔄 正在加载配置并启动监控...</p>
            </div>
          </div>
        </div>

        <!-- 绊线计数面板 -->
        <div id="lineCrossingPanel" class="line-crossing-panel" style="display: none;">
          <div class="panel-header">
            <h3>📏 人数统计</h3>
          </div>
          <div class="panel-content">
            <div class="count-item">
              <span class="count-label">进入:</span>
              <span class="count-value" id="enterCount">0</span>
            </div>
            <div class="count-item">
              <span class="count-label">离开:</span>
              <span class="count-value" id="exitCount">0</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="js/monitor-controller.js"></script>
</body>

</html>

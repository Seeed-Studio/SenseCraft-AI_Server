<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SenseCraft AI</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="industrial-container config-page">
    <!-- 顶部导航栏 -->
    <nav class="navbar">
      <div class="navbar-brand">
        <h1>SenseCraft AI</h1>
      </div>
      <ul class="navbar-nav">
        <li><a href="index.html" class="nav-link">🏠</a></li>
        <li><span class="nav-link" id="currentTime">🕐 加载中...</span></li>
        <li><a href="config.html" class="nav-link active">⚙️</a></li>
      </ul>
    </nav>

    <!-- 主内容区域 -->
    <div class="main-content">
      <!-- 配置面板 -->
      <div class="control-panel">
        <!-- 视频源配置 -->
        <div class="control-group">
          <h4>📹 视频源配置</h4>
          <div class="form-group">
            <label for="videoSource">视频源</label>
            <select id="videoSource" class="form-control select">
              <option value="">加载中...</option>
            </select>
            <div id="sourceError" class="error-message" style="display: none;"></div>
          </div>
          <div class="form-group" id="rtspInputGroup" style="display: none;">
            <label for="rtspUrl">RTSP地址</label>
            <input type="text" id="rtspUrl" class="form-control" placeholder="rtsp://192.168.1.100:554/stream">
          </div>

          <!-- 视频源上传 -->
          <div class="form-group">
            <label for="videoUpload">上传视频文件</label>
            <input type="file" id="videoUpload" class="form-control" accept="video/*,.mp4,.avi,.mov,.mkv" multiple>
            <small class="form-text">支持格式: MP4, AVI, MOV, MKV</small>
            <button id="uploadVideoBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
              <span id="uploadVideoText">上传视频</span>
            </button>
            <div id="videoUploadStatus" class="upload-status" style="display: none;"></div>
          </div>

          <!-- 视频源管理 -->
          <div id="sourceList" class="source-list">
            <div class="text-center" style="color: var(--text-muted); padding: 20px;">
              加载中...
            </div>
          </div>
        </div>

        <!-- AI模型配置 -->
        <div class="control-group">
          <h4>🤖 AI模型配置</h4>
          <div class="form-group">
            <label for="modelSelect">选择模型</label>
            <select id="modelSelect" class="form-control select">
              <option value="">加载中...</option>
            </select>
            <div id="modelError" class="error-message" style="display: none;"></div>
          </div>

          <!-- 模型上传 -->
          <div class="form-group">
            <label for="modelUpload">上传模型文件</label>
            <input type="file" id="modelUpload" class="form-control" accept=".pt,.pth,.onnx,.engine" multiple>
            <small class="form-text">支持格式: PT, PTH, ONNX, ENGINE</small>
            <button id="uploadModelBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
              <span id="uploadModelText">上传模型</span>
            </button>
            <div id="modelUploadStatus" class="upload-status" style="display: none;"></div>
          </div>

          <!-- 模型管理 -->
          <div id="modelList" class="model-list">
            <div class="text-center" style="color: var(--text-muted); padding: 20px;">
              加载中...
            </div>
          </div>
        </div>

        <!-- 推理参数配置 -->
        <div class="control-group">
          <h4>🎯 推理参数</h4>
          <div class="form-group">
            <label for="confidence">置信度阈值: <span id="confValue">0.25</span></label>
            <input type="range" id="confidence" class="form-control" min="0.1" max="1.0" step="0.05" value="0.25">
          </div>
          <div class="form-group">
            <label for="maxDetections">最大检测数量: <span id="maxDetValue">300</span></label>
            <input type="range" id="maxDetections" class="form-control" min="1" max="1000" step="10" value="300">
          </div>
          <div class="switch-container">
            <span>半精度推理</span>
            <label class="switch">
              <input type="checkbox" id="halfPrecision">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <!-- 显示设置 -->
        <div class="control-group">
          <h4>🎨 显示设置</h4>
          <div class="switch-container">
            <span>显示FPS</span>
            <label class="switch">
              <input type="checkbox" id="showFps">
              <span class="slider"></span>
            </label>
          </div>
          <div class="switch-container">
            <span>显示时间戳</span>
            <label class="switch">
              <input type="checkbox" id="showTime">
              <span class="slider"></span>
            </label>
          </div>
          <div class="switch-container">
            <span>显示检测框</span>
            <label class="switch">
              <input type="checkbox" id="showBox" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="form-group" id="boxColorGroup">
            <label for="boxColor">检测框颜色</label>
            <select id="boxColor" class="form-control select">
              <option value="">默认YOLO颜色</option>
              <option value="red">红色</option>
              <option value="green">绿色</option>
              <option value="blue">蓝色</option>
              <option value="yellow">黄色</option>
              <option value="cyan">青色</option>
              <option value="magenta">洋红色</option>
              <option value="orange" selected>橙色</option>
              <option value="purple">紫色</option>
              <option value="pink">粉色</option>
              <option value="white">白色</option>
            </select>
          </div>
        </div>

        <!-- 跟踪设置 -->
        <div class="control-group">
          <h4>🛤️ 跟踪设置</h4>
          <div class="switch-container">
            <span>目标跟踪</span>
            <label class="switch">
              <input type="checkbox" id="tracking" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div class="switch-container">
            <span>显示轨迹线</span>
            <label class="switch">
              <input type="checkbox" id="showTrail" checked>
              <span class="slider"></span>
            </label>
          </div>
          <div id="trailConfig" class="trail-config" style="display: block;">
            <div class="form-group">
              <label for="trailLength">轨迹长度: <span id="trailLengthValue">50</span></label>
              <input type="range" id="trailLength" class="form-control" min="10" max="100" step="5" value="50">
            </div>
            <div class="form-group">
              <label for="trailThickness">轨迹线粗细: <span id="trailThicknessValue">2</span></label>
              <input type="range" id="trailThickness" class="form-control" min="1" max="5" step="1" value="2">
            </div>
            <div class="form-group">
              <label for="trailColor">轨迹颜色</label>
              <select id="trailColor" class="form-control select">
                <option value="">自动生成颜色</option>
                <option value="red">红色</option>
                <option value="green">绿色</option>
                <option value="blue" selected>蓝色</option>
                <option value="yellow">黄色</option>
                <option value="cyan">青色</option>
                <option value="magenta">洋红色</option>
                <option value="orange">橙色</option>
                <option value="purple">紫色</option>
                <option value="pink">粉色</option>
                <option value="white">白色</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 绊线检测设置 -->
        <div class="control-group">
          <h4>📏 绊线检测设置</h4>
          <div class="switch-container">
            <span>启用绊线检测</span>
            <label class="switch">
              <input type="checkbox" id="lineCrossingEnabled">
              <span class="slider"></span>
            </label>
          </div>
          <div id="lineCrossingConfig" class="line-crossing-config" style="display: none;">
            <div class="form-group">
              <label for="lineDirection">绊线方向</label>
              <select id="lineDirection" class="form-control select">
                <option value="horizontal" selected>水平线</option>
                <option value="vertical">垂直线</option>
              </select>
            </div>
            <div class="form-group">
              <label for="lineX1">起点X坐标: <span id="lineX1Value">100</span></label>
              <input type="range" id="lineX1" class="form-control" min="0" max="1920" step="10" value="100">
            </div>
            <div class="form-group">
              <label for="lineY1">起点Y坐标: <span id="lineY1Value">300</span></label>
              <input type="range" id="lineY1" class="form-control" min="0" max="1080" step="10" value="300">
            </div>
            <div class="form-group">
              <label for="lineX2">终点X坐标: <span id="lineX2Value">800</span></label>
              <input type="range" id="lineX2" class="form-control" min="0" max="1920" step="10" value="800">
            </div>
            <div class="form-group">
              <label for="lineY2">终点Y坐标: <span id="lineY2Value">300</span></label>
              <input type="range" id="lineY2" class="form-control" min="0" max="1080" step="10" value="300">
            </div>
            <div class="form-group">
              <label for="lineTolerance">检测容差: <span id="lineToleranceValue">5</span></label>
              <input type="range" id="lineTolerance" class="form-control" min="1" max="20" step="1" value="5">
            </div>
            <div class="form-group">
              <label for="lineColor">绊线颜色</label>
              <select id="lineColor" class="form-control select">
                <option value="green" selected>绿色</option>
                <option value="red">红色</option>
                <option value="blue">蓝色</option>
                <option value="yellow">黄色</option>
                <option value="cyan">青色</option>
                <option value="magenta">洋红色</option>
                <option value="orange">橙色</option>
                <option value="purple">紫色</option>
                <option value="white">白色</option>
              </select>
            </div>
            <div class="form-group">
              <label for="lineThickness">绊线粗细: <span id="lineThicknessValue">3</span></label>
              <input type="range" id="lineThickness" class="form-control" min="1" max="10" step="1" value="3">
            </div>
            <div class="switch-container">
              <span>显示绊线</span>
              <label class="switch">
                <input type="checkbox" id="showLine" checked>
                <span class="slider"></span>
              </label>
            </div>
            <div class="switch-container">
              <span>显示计数</span>
              <label class="switch">
                <input type="checkbox" id="showCounts" checked>
                <span class="slider"></span>
              </label>
            </div>
            <div class="btn-group">
              <button id="resetLineCountsBtn" class="btn btn-warning">重置计数</button>
            </div>
          </div>
        </div>

        <!-- 保存配置 -->
        <div class="control-group">
          <h4>💾 配置管理</h4>
          <div class="btn-group">
            <button id="saveConfigBtn" class="btn btn-success">保存配置</button>
            <button id="loadConfigBtn" class="btn btn-primary">加载配置</button>
            <button id="resetConfigBtn" class="btn btn-warning">重置配置</button>
          </div>
          <div class="btn-group">
            <button id="exportConfigBtn" class="btn btn-secondary">导出配置</button>
            <button id="importConfigBtn" class="btn btn-secondary">导入配置</button>
          </div>
        </div>
      </div>

      <!-- 预览面板 -->
      <div class="status-panel">
        <!-- 配置预览 -->
        <div class="control-group">
          <h4>👁️ 配置预览</h4>
          <div id="configPreview" class="info-panel">
            <div class="text-center" style="color: var(--text-muted); padding: 20px;">
              配置将在此处预览
            </div>
          </div>
        </div>

        <!-- 系统状态 -->
        <div class="control-group">
          <h4>🔧 系统状态</h4>
          <div class="info-item">
            <span class="info-label">视频源数量:</span>
            <span class="info-value" id="sourceCount">0</span>
          </div>
          <div class="info-item">
            <span class="info-label">模型数量:</span>
            <span class="info-value" id="modelCount">0</span>
          </div>
          <div class="info-item">
            <span class="info-label">配置状态:</span>
            <span class="info-value" id="configStatus">未保存</span>
          </div>
        </div>

        <!-- 快速操作 -->
        <div class="control-group">
          <h4>⚡ 快速操作</h4>
          <div class="btn-group">
            <button id="startMonitorBtn" class="btn btn-success">启动监控</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    class ConfigController {
      constructor() {
        this.sources = [];
        this.models = [];
        this.config = {};

        this.initializeElements();
        this.initializeEventListeners();
        this.startTimeUpdate();
        this.loadData();
      }

      initializeElements() {
        this.videoSource = document.getElementById('videoSource');
        this.rtspInputGroup = document.getElementById('rtspInputGroup');
        this.rtspUrl = document.getElementById('rtspUrl');
        this.modelSelect = document.getElementById('modelSelect');
        this.confidence = document.getElementById('confidence');
        this.maxDetections = document.getElementById('maxDetections');
        this.halfPrecision = document.getElementById('halfPrecision');
        this.showFps = document.getElementById('showFps');
        this.showTime = document.getElementById('showTime');
        this.showBox = document.getElementById('showBox');
        this.boxColor = document.getElementById('boxColor');
        this.tracking = document.getElementById('tracking');
        this.showTrail = document.getElementById('showTrail');
        this.trailConfig = document.getElementById('trailConfig');
        this.trailLength = document.getElementById('trailLength');
        this.trailThickness = document.getElementById('trailThickness');
        this.trailColor = document.getElementById('trailColor');
        
        // 绊线检测元素
        this.lineCrossingEnabled = document.getElementById('lineCrossingEnabled');
        this.lineCrossingConfig = document.getElementById('lineCrossingConfig');
        this.lineDirection = document.getElementById('lineDirection');
        this.lineX1 = document.getElementById('lineX1');
        this.lineY1 = document.getElementById('lineY1');
        this.lineX2 = document.getElementById('lineX2');
        this.lineY2 = document.getElementById('lineY2');
        this.lineTolerance = document.getElementById('lineTolerance');
        this.lineColor = document.getElementById('lineColor');
        this.lineThickness = document.getElementById('lineThickness');
        this.showLine = document.getElementById('showLine');
        this.showCounts = document.getElementById('showCounts');
        
        this.currentTimeElement = document.getElementById('currentTime');
      }

      initializeEventListeners() {
        // 视频源选择
        this.videoSource.addEventListener('change', (e) => {
          this.toggleRtspInput(e.target.value);
          this.updateConfigPreview();
        });

        // RTSP输入
        this.rtspUrl.addEventListener('input', () => this.updateConfigPreview());

        // 模型选择
        this.modelSelect.addEventListener('change', () => this.updateConfigPreview());

        // 参数滑块
        this.confidence.addEventListener('input', (e) => {
          document.getElementById('confValue').textContent = e.target.value;
          this.updateConfigPreview();
        });

        this.maxDetections.addEventListener('input', (e) => {
          document.getElementById('maxDetValue').textContent = e.target.value;
          this.updateConfigPreview();
        });

        // 轨迹设置
        this.showTrail.addEventListener('change', (e) => {
          this.trailConfig.style.display = e.target.checked ? 'block' : 'none';
          this.updateConfigPreview();
        });

        this.trailLength.addEventListener('input', (e) => {
          document.getElementById('trailLengthValue').textContent = e.target.value;
          this.updateConfigPreview();
        });

        this.trailThickness.addEventListener('input', (e) => {
          document.getElementById('trailThicknessValue').textContent = e.target.value;
          this.updateConfigPreview();
        });

        // 绊线检测设置
        this.lineCrossingEnabled.addEventListener('change', (e) => {
          this.lineCrossingConfig.style.display = e.target.checked ? 'block' : 'none';
          this.updateConfigPreview();
        });

        this.lineDirection.addEventListener('change', () => {
          this.updateLineCoordinates();
          this.updateConfigPreview();
        });

        this.lineX1.addEventListener('input', (e) => {
          document.getElementById('lineX1Value').textContent = e.target.value;
          this.updateConfigPreview();
        });

        this.lineY1.addEventListener('input', (e) => {
          document.getElementById('lineY1Value').textContent = e.target.value;
          this.updateConfigPreview();
        });

        this.lineX2.addEventListener('input', (e) => {
          document.getElementById('lineX2Value').textContent = e.target.value;
          this.updateConfigPreview();
        });

        this.lineY2.addEventListener('input', (e) => {
          document.getElementById('lineY2Value').textContent = e.target.value;
          this.updateConfigPreview();
        });

        this.lineTolerance.addEventListener('input', (e) => {
          document.getElementById('lineToleranceValue').textContent = e.target.value;
          this.updateConfigPreview();
        });

        this.lineThickness.addEventListener('input', (e) => {
          document.getElementById('lineThicknessValue').textContent = e.target.value;
          this.updateConfigPreview();
        });

        // 绊线显示设置
        this.showLine.addEventListener('change', () => this.updateConfigPreview());
        this.showCounts.addEventListener('change', () => this.updateConfigPreview());

        // 实时更新预览
        const realTimeControls = ['halfPrecision', 'showFps', 'showTime', 'showBox', 'boxColor', 'tracking', 'trailColor', 'lineColor', 'showLine', 'showCounts'];
        realTimeControls.forEach(controlId => {
          document.getElementById(controlId).addEventListener('change', () => this.updateConfigPreview());
        });

        // 文件上传
        document.getElementById('uploadVideoBtn').addEventListener('click', () => this.uploadVideo());
        document.getElementById('uploadModelBtn').addEventListener('click', () => this.uploadModel());

        // 配置管理
        document.getElementById('saveConfigBtn').addEventListener('click', () => this.saveConfig());
        document.getElementById('loadConfigBtn').addEventListener('click', () => this.loadConfig());
        document.getElementById('resetConfigBtn').addEventListener('click', () => this.resetConfig());
        document.getElementById('exportConfigBtn').addEventListener('click', () => this.exportConfig());
        document.getElementById('importConfigBtn').addEventListener('click', () => this.importConfig());

        // 绊线重置计数
        document.getElementById('resetLineCountsBtn').addEventListener('click', () => this.resetLineCounts());

        // 快速操作
        document.getElementById('startMonitorBtn').addEventListener('click', () => this.startMonitor());
      }

      async loadData() {
        await Promise.all([
          this.loadSources(),
          this.loadModels()
        ]);
        // 数据加载完成后应用保存的配置
        setTimeout(async () => {
          await this.loadSavedConfig();
        }, 100); // 给一点时间让DOM更新
      }

      async loadSources() {
        try {
          const response = await industrialMonitor.request('/sources/list');
          console.log('视频源响应:', response);
          this.sources = response.list || [];
          console.log('加载到的视频源:', this.sources);
          this.populateSourceSelect();
          this.updateSourceList();
          this.updateSourceCount();
        } catch (error) {
          console.error('加载视频源失败:', error);
          industrialMonitor.showError('sourceError', '加载视频源失败: ' + error.message);
        }
      }

      async loadModels() {
        try {
          const response = await industrialMonitor.request('/models/list');
          console.log('模型响应:', response);
          this.models = response.list || [];
          console.log('加载到的模型:', this.models);
          this.populateModelSelect();
          this.updateModelList();
          this.updateModelCount();
        } catch (error) {
          console.error('加载模型失败:', error);
          industrialMonitor.showError('modelError', '加载模型失败: ' + error.message);
        }
      }

      populateSourceSelect() {
        this.videoSource.innerHTML = '';

        this.sources.forEach(source => {
          console.log(source);
          const option = document.createElement('option');
          option.value = source;
          option.textContent = `本地视频 (${source})`;
          this.videoSource.appendChild(option);
        });

        const cameraOption = document.createElement('option');
        cameraOption.value = '/dev/video0';
        cameraOption.textContent = 'USB摄像头 (/dev/video0)';
        this.videoSource.appendChild(cameraOption);

        const rtspOption = document.createElement('option');
        rtspOption.value = 'rtsp://';
        rtspOption.textContent = 'RTSP流';
        this.videoSource.appendChild(rtspOption);

        if (this.sources.length > 0) {
          this.videoSource.value = this.sources[0];
        }
      }

      populateModelSelect() {
        this.modelSelect.innerHTML = '';

        this.models.forEach(model => {
          const option = document.createElement('option');
          // 尝试不同的模型ID字段
          const modelId = model.arguments?.uuid || model.uuid || model.id || model.filename || model.name;
          option.value = modelId;
          option.textContent = model.name || model.filename || modelId;
          this.modelSelect.appendChild(option);
        });

        if (this.models.length > 0) {
          const firstModelId = this.models[0].arguments?.uuid || this.models[0].uuid || this.models[0].id || this.models[0].filename || this.models[0].name;
          this.modelSelect.value = firstModelId;
        }
      }

      updateSourceList() {
        const sourceList = document.getElementById('sourceList');

        if (this.sources.length === 0) {
          sourceList.innerHTML = '<div class="text-center" style="color: var(--text-muted); padding: 20px;">暂无视频源</div>';
          return;
        }

        sourceList.innerHTML = '';
        this.sources.forEach(source => {
          const item = document.createElement('div');
          item.className = 'source-item';
          item.innerHTML = `
            <div>
              <div class="source-name">${source}</div>
              <div class="file-info">本地视频文件</div>
            </div>
            <div class="source-actions">
              <button class="btn btn-sm btn-delete" onclick="configController.deleteSource('${source}')">删除</button>
            </div>
          `;
          sourceList.appendChild(item);
        });
      }

      updateModelList() {
        const modelList = document.getElementById('modelList');

        if (this.models.length === 0) {
          modelList.innerHTML = '<div class="text-center" style="color: var(--text-muted); padding: 20px;">暂无模型</div>';
          return;
        }

        modelList.innerHTML = '';
        this.models.forEach(model => {
          const item = document.createElement('div');
          item.className = 'model-item';
          const modelId = model.arguments?.uuid || model.uuid || model.id || model.filename || model.name;
          const modelName = model.name || model.filename || modelId;
          const deleteTarget = model.filename || model.name || modelId;
          item.innerHTML = `
            <div>
              <div class="model-name">${modelName}</div>
              <div class="file-info">${modelId}</div>
            </div>
            <div class="model-actions">
              <button class="btn btn-sm btn-delete" onclick="configController.deleteModel('${deleteTarget}')">删除</button>
            </div>
          `;
          modelList.appendChild(item);
        });
      }

      updateSourceCount() {
        document.getElementById('sourceCount').textContent = this.sources.length;
      }

      updateModelCount() {
        document.getElementById('modelCount').textContent = this.models.length;
      }

      toggleRtspInput(sourceType) {
        this.rtspInputGroup.style.display = sourceType === 'rtsp://' ? 'block' : 'none';
      }

      updateConfigPreview() {
        const config = this.getCurrentConfig();
        const preview = document.getElementById('configPreview');

        preview.innerHTML = `
          <div class="info-item">
            <span class="info-label">视频源:</span>
            <span class="info-value">${config.src || '未选择'}</span>
          </div>
          <div class="info-item">
            <span class="info-label">AI模型:</span>
            <span class="info-value">${config.model_id || '未选择'}</span>
          </div>
          <div class="info-item">
            <span class="info-label">置信度:</span>
            <span class="info-value">${config.conf}</span>
          </div>
          <div class="info-item">
            <span class="info-label">最大检测:</span>
            <span class="info-value">${config.max_det}</span>
          </div>
          <div class="info-item">
            <span class="info-label">显示设置:</span>
            <span class="info-value">${this.getDisplaySettings(config)}</span>
          </div>
          <div class="info-item">
            <span class="info-label">跟踪设置:</span>
            <span class="info-value">${this.getTrackingSettings(config)}</span>
          </div>
          <div class="info-item">
            <span class="info-label">绊线检测:</span>
            <span class="info-value">${this.getLineCrossingSettings(config)}</span>
          </div>
        `;
      }

      getCurrentConfig() {
        const sourceType = this.videoSource.value;
        let source = sourceType;
        if (sourceType === 'rtsp://') {
          source = this.rtspUrl.value || 'rtsp://192.168.1.100:554/stream';
        }

        return {
          src: source,
          model_id: this.modelSelect.value,
          conf: this.confidence.value,
          max_det: this.maxDetections.value,
          half: this.halfPrecision.checked ? '1' : '0',
          show_fps: this.showFps.checked ? '1' : '0',
          show_time: this.showTime.checked ? '1' : '0',
          show_box: this.showBox.checked ? '1' : '0',
          box_color: this.boxColor.value,
          track: this.tracking.checked ? '1' : '0',
          show_trail: this.showTrail.checked ? '1' : '0',
          trail_length: this.trailLength.value,
          trail_thickness: this.trailThickness.value,
          trail_color: this.trailColor.value,
          line_crossing: this.getLineCrossingConfig()
        };
      }

      getDisplaySettings(config) {
        const settings = [];
        if (config.show_fps === '1') settings.push('FPS');
        if (config.show_time === '1') settings.push('时间戳');
        if (config.show_box === '1') settings.push('检测框');
        return settings.length > 0 ? settings.join(', ') : '无';
      }

      getTrackingSettings(config) {
        const settings = [];
        if (config.track === '1') settings.push('目标跟踪');
        if (config.show_trail === '1') settings.push('轨迹线');
        return settings.length > 0 ? settings.join(', ') : '无';
      }

      getLineCrossingSettings(config) {
        if (!config.line_crossing || !config.line_crossing.enabled) {
          return '未启用';
        }
        const direction = config.line_crossing.direction === 'horizontal' ? '水平线' : '垂直线';
        const showLine = config.line_crossing.show_line !== false ? '显示绊线' : '隐藏绊线';
        const showCounts = config.line_crossing.show_counts !== false ? '显示计数' : '隐藏计数';
        return `${direction} (${config.line_crossing.x1},${config.line_crossing.y1}) - (${config.line_crossing.x2},${config.line_crossing.y2}) | ${showLine}, ${showCounts}`;
      }

      getLineCrossingConfig() {
        if (!this.lineCrossingEnabled.checked) {
          return { enabled: false };
        }

        return {
          enabled: true,
          direction: this.lineDirection.value,
          x1: parseInt(this.lineX1.value),
          y1: parseInt(this.lineY1.value),
          x2: parseInt(this.lineX2.value),
          y2: parseInt(this.lineY2.value),
          tolerance: parseInt(this.lineTolerance.value),
          color: this.lineColor.value,
          thickness: parseInt(this.lineThickness.value),
          show_line: this.showLine.checked,
          show_counts: this.showCounts.checked
        };
      }

      updateLineCoordinates() {
        const direction = this.lineDirection.value;
        if (direction === 'horizontal') {
          // 水平线：Y坐标相同
          this.lineY2.value = this.lineY1.value;
          document.getElementById('lineY2Value').textContent = this.lineY1.value;
        } else {
          // 垂直线：X坐标相同
          this.lineX2.value = this.lineX1.value;
          document.getElementById('lineX2Value').textContent = this.lineX1.value;
        }
      }

      async resetLineCounts() {
        if (!confirm('确定要重置绊线计数吗？')) {
          return;
        }

        try {
          const response = await industrialMonitor.request('/line/reset');
          industrialMonitor.showNotification('绊线计数已重置', 'success');
        } catch (error) {
          console.error('重置绊线计数失败:', error);
          industrialMonitor.showNotification('重置失败: ' + error.message, 'error');
        }
      }

      async uploadVideo() {
        const fileInput = document.getElementById('videoUpload');
        const files = fileInput.files;

        if (files.length === 0) {
          industrialMonitor.showNotification('请选择要上传的视频文件', 'error');
          return;
        }

        const uploadBtn = document.getElementById('uploadVideoBtn');
        uploadBtn.disabled = true;
        industrialMonitor.showNotification('正在上传视频文件...', 'info');

        try {
          for (let i = 0; i < files.length; i++) {
            const file = files[i];
            await industrialMonitor.uploadFile(file, '/upload');
          }

          industrialMonitor.showNotification(`成功上传 ${files.length} 个视频文件`, 'success');
          fileInput.value = '';
          await this.loadSources();

        } catch (error) {
          console.error('视频上传失败:', error);
          industrialMonitor.showNotification('上传失败: ' + error.message, 'error');
        } finally {
          uploadBtn.disabled = false;
        }
      }

      async uploadModel() {
        const fileInput = document.getElementById('modelUpload');
        const files = fileInput.files;

        if (files.length === 0) {
          industrialMonitor.showNotification('请选择要上传的模型文件', 'error');
          return;
        }

        const uploadBtn = document.getElementById('uploadModelBtn');
        uploadBtn.disabled = true;
        industrialMonitor.showNotification('正在上传模型文件...', 'info');

        try {
          for (let i = 0; i < files.length; i++) {
            const file = files[i];
            await industrialMonitor.uploadFile(file, '/upload');
          }

          industrialMonitor.showNotification(`成功上传 ${files.length} 个模型文件`, 'success');
          fileInput.value = '';
          await this.loadModels();

        } catch (error) {
          console.error('模型上传失败:', error);
          industrialMonitor.showNotification('上传失败: ' + error.message, 'error');
        } finally {
          uploadBtn.disabled = false;
        }
      }

      async deleteSource(sourceName) {
        if (!confirm(`确定要删除视频源 "${sourceName}" 吗？`)) {
          return;
        }

        try {
          const response = await industrialMonitor.request(`/sources/del?name=${encodeURIComponent(sourceName)}`);
          industrialMonitor.showNotification('删除成功', 'success');
          await this.loadSources();
        } catch (error) {
          console.error('删除视频源失败:', error);
          industrialMonitor.showNotification('删除失败: ' + error.message, 'error');
        }
      }

      async deleteModel(modelName) {
        if (!confirm(`确定要删除模型 "${modelName}" 吗？`)) {
          return;
        }

        try {
          const response = await industrialMonitor.request(`/models/del?name=${encodeURIComponent(modelName)}`);
          industrialMonitor.showNotification('删除成功', 'success');
          await this.loadModels();
        } catch (error) {
          console.error('删除模型失败:', error);
          industrialMonitor.showNotification('删除失败: ' + error.message, 'error');
        }
      }

      async saveConfig() {
        const config = this.getCurrentConfig();
        
        try {
          // 显示保存中状态
          document.getElementById('configStatus').textContent = '保存中...';
          industrialMonitor.showNotification('正在保存配置到服务器...', 'info');
          
          // 调用后端接口保存配置
          const response = await industrialMonitor.request('/appConfigs', {
            method: 'POST',
            body: JSON.stringify(config)
          });
          
          // 保存绊线配置到服务器
          if (config.line_crossing && config.line_crossing.enabled) {
            await industrialMonitor.request('/line/config', {
              method: 'POST',
              body: JSON.stringify(config.line_crossing)
            });
          }
          
          // 同时保存到本地存储作为备份
          industrialMonitor.storage.set('appConfig', config);
          
          document.getElementById('configStatus').textContent = '已保存到服务器';
          industrialMonitor.showNotification('配置已成功保存到服务器', 'success');
          
        } catch (error) {
          console.error('保存配置失败:', error);
          document.getElementById('configStatus').textContent = '保存失败';
          industrialMonitor.showNotification('保存配置失败: ' + error.message, 'error');
        }
      }

      async loadConfig() {
        try {
          document.getElementById('configStatus').textContent = '加载中...';
          industrialMonitor.showNotification('正在从服务器加载配置...', 'info');
          
          // 从服务器获取配置
          const response = await industrialMonitor.request('/appConfigs');
          const config = response || {};
          
          // 从服务器获取绊线配置
          try {
            const lineConfig = await industrialMonitor.request('/line/config');
            if (lineConfig && lineConfig.enabled) {
              config.line_crossing = lineConfig;
            }
          } catch (lineError) {
            console.warn('加载绊线配置失败:', lineError);
          }
          
          this.applyConfig(config);
          document.getElementById('configStatus').textContent = '已从服务器加载';
          industrialMonitor.showNotification('配置已从服务器加载', 'success');
          
        } catch (error) {
          console.error('从服务器加载配置失败:', error);
          industrialMonitor.showNotification('从服务器加载配置失败，尝试加载本地备份', 'warning');
          
          // 如果服务器加载失败，尝试加载本地备份
          const localConfig = industrialMonitor.storage.get('appConfig', {});
          this.applyConfig(localConfig);
          document.getElementById('configStatus').textContent = '已加载本地备份';
          industrialMonitor.showNotification('已加载本地备份配置', 'info');
        }
      }

      resetConfig() {
        if (!confirm('确定要重置所有配置吗？')) {
          return;
        }

        this.applyConfig({});
        document.getElementById('configStatus').textContent = '已重置';
        industrialMonitor.showNotification('配置已重置', 'info');
      }

      exportConfig() {
        const config = this.getCurrentConfig();
        const configStr = JSON.stringify(config, null, 2);
        const blob = new Blob([configStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        industrialMonitor.downloadFile(url, 'sensecraft-config.json');
        URL.revokeObjectURL(url);
        industrialMonitor.showNotification('配置已导出', 'success');
      }

      importConfig() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = async (e) => {
          const file = e.target.files[0];
          if (file) {
            try {
              const text = await file.text();
              const config = JSON.parse(text);
              this.applyConfig(config);
              document.getElementById('configStatus').textContent = '已导入';
              industrialMonitor.showNotification('配置已导入', 'success');
            } catch (error) {
              industrialMonitor.showNotification('导入失败: 文件格式错误', 'error');
            }
          }
        };
        input.click();
      }

      applyConfig(config) {
        // 应用视频源配置
        if (config.src) {
          if (config.src.startsWith('rtsp://')) {
            this.videoSource.value = 'rtsp://';
            this.rtspUrl.value = config.src;
            this.toggleRtspInput('rtsp://');
          } else {
            // 检查视频源是否在下拉列表中
            const sourceExists = Array.from(this.videoSource.options).some(option => option.value === config.src);
            if (sourceExists) {
              this.videoSource.value = config.src;
              this.toggleRtspInput(config.src);
            } else {
              console.warn('保存的视频源不存在:', config.src);
            }
          }
        }

        // 应用模型配置
        if (config.model_id) {
          // 检查模型是否在下拉列表中
          const modelExists = Array.from(this.modelSelect.options).some(option => option.value === config.model_id);
          if (modelExists) {
            this.modelSelect.value = config.model_id;
          } else {
            console.warn('保存的模型不存在:', config.model_id);
          }
        }

        // 应用参数配置
        if (config.conf) {
          this.confidence.value = config.conf;
          document.getElementById('confValue').textContent = config.conf;
        }

        if (config.max_det) {
          this.maxDetections.value = config.max_det;
          document.getElementById('maxDetValue').textContent = config.max_det;
        }

        // 应用显示配置
        this.halfPrecision.checked = config.half === '1';
        this.showFps.checked = config.show_fps === '1';
        this.showTime.checked = config.show_time === '1';
        this.showBox.checked = config.show_box !== '0'; // 默认为true
        if (config.box_color) this.boxColor.value = config.box_color;

        // 应用跟踪配置
        this.tracking.checked = config.track !== '0'; // 默认为true
        this.showTrail.checked = config.show_trail !== '0'; // 默认为true
        this.trailConfig.style.display = config.show_trail !== '0' ? 'block' : 'none';

        if (config.trail_length) {
          this.trailLength.value = config.trail_length;
          document.getElementById('trailLengthValue').textContent = config.trail_length;
        }

        if (config.trail_thickness) {
          this.trailThickness.value = config.trail_thickness;
          document.getElementById('trailThicknessValue').textContent = config.trail_thickness;
        }

        if (config.trail_color) this.trailColor.value = config.trail_color;

        // 应用绊线配置
        if (config.line_crossing) {
          this.lineCrossingEnabled.checked = config.line_crossing.enabled || false;
          this.lineCrossingConfig.style.display = config.line_crossing.enabled ? 'block' : 'none';
          
          if (config.line_crossing.enabled) {
            if (config.line_crossing.direction) this.lineDirection.value = config.line_crossing.direction;
            if (config.line_crossing.x1) {
              this.lineX1.value = config.line_crossing.x1;
              document.getElementById('lineX1Value').textContent = config.line_crossing.x1;
            }
            if (config.line_crossing.y1) {
              this.lineY1.value = config.line_crossing.y1;
              document.getElementById('lineY1Value').textContent = config.line_crossing.y1;
            }
            if (config.line_crossing.x2) {
              this.lineX2.value = config.line_crossing.x2;
              document.getElementById('lineX2Value').textContent = config.line_crossing.x2;
            }
            if (config.line_crossing.y2) {
              this.lineY2.value = config.line_crossing.y2;
              document.getElementById('lineY2Value').textContent = config.line_crossing.y2;
            }
            if (config.line_crossing.tolerance) {
              this.lineTolerance.value = config.line_crossing.tolerance;
              document.getElementById('lineToleranceValue').textContent = config.line_crossing.tolerance;
            }
            if (config.line_crossing.color) this.lineColor.value = config.line_crossing.color;
            if (config.line_crossing.thickness) {
              this.lineThickness.value = config.line_crossing.thickness;
              document.getElementById('lineThicknessValue').textContent = config.line_crossing.thickness;
            }
            if (config.line_crossing.show_line !== undefined) this.showLine.checked = config.line_crossing.show_line;
            if (config.line_crossing.show_counts !== undefined) this.showCounts.checked = config.line_crossing.show_counts;
          }
        }

        this.updateConfigPreview();
      }



      async startMonitor() {
        const config = this.getCurrentConfig();
        
        try {
          // 保存配置到服务器
          await industrialMonitor.request('/appConfigs', {
            method: 'POST',
            body: JSON.stringify(config)
          });
          
          // 保存绊线配置到服务器
          if (config.line_crossing && config.line_crossing.enabled) {
            await industrialMonitor.request('/line/config', {
              method: 'POST',
              body: JSON.stringify(config.line_crossing)
            });
          }
          
          // 同时保存到本地存储作为备份
          industrialMonitor.storage.set('appConfig', config);
          
          industrialMonitor.showNotification('配置已保存，正在启动监控...', 'success');
          
          // 跳转到主页
          window.location.href = 'index.html';
          
        } catch (error) {
          console.error('保存配置失败:', error);
          industrialMonitor.showNotification('保存配置失败，但将继续启动监控', 'warning');
          
          // 即使保存失败也跳转，使用本地配置
          industrialMonitor.storage.set('appConfig', config);
          window.location.href = 'index.html';
        }
      }

      startTimeUpdate() {
        this.updateCurrentTime(); // 立即更新一次时间
        setInterval(() => {
          this.updateCurrentTime();
        }, 1000);
      }

      updateCurrentTime() {
        const now = new Date();
        const timeString = now.toLocaleString('zh-CN', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: false
        });
        this.currentTimeElement.textContent = `🕐 ${timeString}`;
      }

      async loadSavedConfig() {
        try {
          // 优先从服务器加载配置
          const response = await industrialMonitor.request('/appConfigs');
          const config = response || {};
          
          // 从服务器获取绊线配置
          try {
            const lineConfig = await industrialMonitor.request('/line/config');
            if (lineConfig && lineConfig.enabled) {
              config.line_crossing = lineConfig;
            }
          } catch (lineError) {
            console.warn('加载绊线配置失败:', lineError);
          }
          
          if (Object.keys(config).length > 0) {
            this.applyConfig(config);
            document.getElementById('configStatus').textContent = '已从服务器加载';
          } else {
            // 如果服务器没有配置，尝试加载本地备份
            const localConfig = industrialMonitor.storage.get('appConfig', {});
            if (Object.keys(localConfig).length > 0) {
              this.applyConfig(localConfig);
              document.getElementById('configStatus').textContent = '已加载本地备份';
            } else {
              // 如果都没有，应用默认配置
              this.applyDefaultConfig();
              document.getElementById('configStatus').textContent = '默认配置';
            }
          }
        } catch (error) {
          console.error('加载服务器配置失败:', error);
          // 服务器加载失败，尝试加载本地备份
          const localConfig = industrialMonitor.storage.get('appConfig', {});
          if (Object.keys(localConfig).length > 0) {
            this.applyConfig(localConfig);
            document.getElementById('configStatus').textContent = '已加载本地备份';
          } else {
            // 如果都没有，应用默认配置
            this.applyDefaultConfig();
            document.getElementById('configStatus').textContent = '默认配置';
          }
        }
      }

      applyDefaultConfig() {
        // 设置默认值
        this.confidence.value = '0.25';
        document.getElementById('confValue').textContent = '0.25';
        this.maxDetections.value = '300';
        document.getElementById('maxDetValue').textContent = '300';
        this.showBox.checked = true;
        this.tracking.checked = true;
        this.showTrail.checked = true;
        this.trailConfig.style.display = 'block';
        this.trailLength.value = '50';
        document.getElementById('trailLengthValue').textContent = '50';
        this.trailThickness.value = '2';
        document.getElementById('trailThicknessValue').textContent = '2';
        
        // 绊线默认配置
        this.lineCrossingEnabled.checked = false;
        this.lineCrossingConfig.style.display = 'none';
        this.lineDirection.value = 'horizontal';
        this.lineX1.value = '100';
        document.getElementById('lineX1Value').textContent = '100';
        this.lineY1.value = '300';
        document.getElementById('lineY1Value').textContent = '300';
        this.lineX2.value = '800';
        document.getElementById('lineX2Value').textContent = '800';
        this.lineY2.value = '300';
        document.getElementById('lineY2Value').textContent = '300';
        this.lineTolerance.value = '5';
        document.getElementById('lineToleranceValue').textContent = '5';
        this.lineColor.value = 'green';
        this.lineThickness.value = '3';
        document.getElementById('lineThicknessValue').textContent = '3';
        this.showLine.checked = true;
        this.showCounts.checked = true;
        
        this.updateConfigPreview();
      }
    }

    // 初始化配置控制器
    let configController;
    document.addEventListener('DOMContentLoaded', () => {
      configController = new ConfigController();
    });
  </script>
</body>

</html>
